name: ci

on:
  merge_group:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart format --set-exit-if-changed .
      - run: dart run tool/test_entry.dart --check
      - name: dart test
        run: |
          for p in packages/*/; do
            [ -d "$p/test" ] || continue
            (cd "$p" && dart test)
          done

  # Stable required-check name for the ruleset and merge queue. Pin them to
  # `ci-required` so renaming the jobs above never silently un-gates merges.
  ci-required:
    if: always()
    needs: [dart]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.dart.result }}" != "success" ]; then
            echo "dart did not succeed: ${{ needs.dart.result }}"
            exit 1
          fi
